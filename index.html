<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Shelf — your anime, manga & light novel library</title>
    <meta
      name="description"
      content="A cozy digital bookshelf that understands your taste. Track, rate, rank and collect anime, manga and light novels."
    />
    <script>
      // Apply the persisted theme and accent before first paint so there is no
      // flash. Both are read from the same one small key, which is why prefs
      // are stored separately from the library.
      try {
        var raw = localStorage.getItem('shelf.prefs')
        var state = raw ? JSON.parse(raw)?.state : null
        var theme = state?.theme
        if (theme === 'system' || !theme) {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.dataset.theme = theme
        var palette = state?.palette || 'ember'
        document.documentElement.dataset.palette = palette

        // A named palette is a stylesheet and needs nothing else. `custom` has
        // no stylesheet to select, so its five variables are written here too —
        // otherwise every reload shows one frame of ember before the store
        // rehydrates. The bands below are a copy of `customAccent` in
        // src/design/theme.ts, which is the source of truth; if they ever
        // disagree, that file wins and this one is the bug.
        if (palette === 'custom') {
          var h = ((Math.round(state?.accentHue ?? 24) % 360) + 360) % 360
          var s = document.documentElement.style
          var dark = theme !== 'light'
          s.setProperty('--accent', 'hsl(' + h + (dark ? ' 78% 65%)' : ' 58% 36%)'))
          s.setProperty('--accent-hover', 'hsl(' + h + (dark ? ' 86% 73%)' : ' 62% 28%)'))
          s.setProperty('--accent-quiet', 'hsl(' + h + (dark ? ' 38% 12%)' : ' 60% 93%)'))
          s.setProperty('--accent-line', 'hsl(' + h + (dark ? ' 32% 26%)' : ' 42% 78%)'))
          s.setProperty('--accent-ink', 'hsl(' + h + (dark ? ' 55% 8%)' : ' 60% 99%)'))
        }
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
        document.documentElement.dataset.palette = 'ember'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
